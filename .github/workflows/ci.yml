name: AiPDF full verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aipdf-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install uv runtime manager
        shell: pwsh
        run: python -m pip install uv

      - name: Install dependencies
        run: npm ci

      - name: Install Anna CLI
        run: npm install -g @anna-ai/cli@0.1.68

      - name: Run full verification matrix
        run: npm test

      - name: Validate Anna app
        working-directory: anna-app/aipdf-editor
        run: anna-app validate --strict

      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aipdf-verification-${{ github.run_id }}
          path: |
            anna-app/aipdf-editor/bundle
            .smoke
          if-no-files-found: ignore
          retention-days: 7
